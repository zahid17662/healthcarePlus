[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# One event loop for the whole run: the app's async engine/pool is created once and reused.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = --strict-markers -ra
markers =
    unit: fast tests, no database
    integration: tests that use the isolated test schema (see tests/conftest.py)
